services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orexmine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orexmine}
      POSTGRES_DB: ${POSTGRES_DB:-orexmine}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-orexmine-development}-postgres-data
